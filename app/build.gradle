plugins {
    id 'com.android.application'
}

def localProps = new Properties()
file('../local.properties').withInputStream { localProps.load(it) }

android {
    namespace 'com.roadwatch.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.roadwatch.mobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "API_BASE_URL", "\"${localProps['api.base.url']}\""
        // REMOVED: Google Maps API key (no longer needed)
        // buildConfigField "String", "MAPS_API_KEY", "\"${localProps['MAPS_API_KEY']}\""
        buildConfigField "String", "MISTRAL_API_KEY", "\"${localProps['MISTRAL_API_KEY']}\""
        // REMOVED: Google Maps manifestPlaceholders (no longer needed)
        // manifestPlaceholders = [mapsApiKey: localProps.getProperty("mapsApiKey", "AIzaSyBwrV-4xgrgG0k73MJ_ZGopRmKm3dn4ExA")]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
        }
    }
    
       buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // REMOVED: Google Maps (replaced with osmdroid)
    // implementation 'com.google.android.gms:play-services-maps:18.2.0'
    
    // ADDED: osmdroid for free OpenStreetMap rendering
    implementation 'org.osmdroid:osmdroid-android:6.1.17'
    implementation 'org.osmdroid:osmdroid-wms:6.1.17'
    implementation 'org.osmdroid:osmdroid-mapsforge:6.1.17'
    
    implementation 'com.google.android.gms:play-services-location:21.2.0'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.fragment:fragment:1.7.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // WorkManager
    implementation 'androidx.work:work-runtime:2.9.0'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.3'
    implementation 'androidx.camera:camera-camera2:1.3.3'
    implementation 'androidx.camera:camera-lifecycle:1.3.3'
    implementation 'androidx.camera:camera-view:1.3.3'

    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Security Crypto
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'

    // REMOVED: Maps Utils (not needed with osmdroid)
    // implementation 'com.google.maps.android:android-maps-utils:3.8.2'

    // Guava
    implementation 'com.google.guava:guava:33.0.0-android'
}

// Apply Google Services plugin to read google-services.json and configure
// Firebase at build time.
apply plugin: 'com.google.gms.google-services'